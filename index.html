<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💰 Тапалка 100$</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Верхняя панель -->
        <div class="header">
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">💵 Баланс</span>
                    <span class="stat-value" id="coinCounter">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">⚡ Энергия</span>
                    <div class="energy-bar">
                        <div class="energy-fill" id="energyFill"></div>
                    </div>
                    <span class="stat-value small" id="energyCounter">500/500</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">📊 Уровень</span>
                    <span class="stat-value" id="levelDisplay">1</span>
                </div>
            </div>
        </div>

        <!-- Главная купюра 100$ -->
        <div class="coin-wrapper">
            <div class="coin-glow"></div>
            <img id="coinImage" src="https://emojicdn.elk.sh/💵" alt="100 долларов">
            <div id="floatingTexts"></div>
        </div>

        <!-- Информация о доходах -->
        <div class="income-info">
            <span>💹 Доход/сек: <span id="incomeDisplay">0</span></span>
            <span>💪 Сила тапа: <span id="tapPowerDisplay">1</span></span>
        </div>

        <!-- Вкладки магазина -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="upgrades">⬆️ Улучшения</button>
            <button class="tab-btn" data-tab="business">🏢 Бизнес</button>
            <button class="tab-btn" data-tab="energy">⚡ Энергия</button>
            <button class="tab-btn" data-tab="bonus">🎁 Бонусы</button>
        </div>

        <!-- Содержимое вкладок -->
        <div class="shop-content">
            <!-- Вкладка улучшений -->
            <div class="tab-panel active" id="tab-upgrades">
                <button class="shop-btn upgrade" onclick="buyUpgrade(50, 1)">
                    <span class="icon">⬆️</span>
                    <span class="text">Улучшить тап</span>
                    <span class="price">50 💵</span>
                </button>
                <button class="shop-btn mega" onclick="buyUpgrade(200, 5)">
                    <span class="icon">🚀</span>
                    <span class="text">Мега-тап</span>
                    <span class="price">200 💵</span>
                </button>
                <button class="shop-btn ultra" onclick="buyUpgrade(1000, 20)">
                    <span class="icon">💎</span>
                    <span class="text">Ультра-тап</span>
                    <span class="price">1000 💵</span>
                </button>
            </div>

            <!-- Вкладка бизнеса -->
            <div class="tab-panel" id="tab-business">
                <button class="shop-btn business" onclick="buyBusiness(500, 10)">
                    <span class="icon">🏪</span>
                    <span class="text">Киоск (+10/сек)</span>
                    <span class="price">500 💵</span>
                </button>
                <button class="shop-btn business" onclick="buyBusiness(2000, 50)">
                    <span class="icon">🏬</span>
                    <span class="text">Магазин (+50/сек)</span>
                    <span class="price">2000 💵</span>
                </button>
                <button class="shop-btn business" onclick="buyBusiness(10000, 300)">
                    <span class="icon">🏭</span>
                    <span class="text">Завод (+300/сек)</span>
                    <span class="price">10 000 💵</span>
                </button>
            </div>

            <!-- Вкладка энергии -->
            <div class="tab-panel" id="tab-energy">
                <button class="shop-btn energy-buy" onclick="buyEnergy()">
                    <span class="icon">🔋</span>
                    <span class="text">Восстановить энергию</span>
                    <span class="price" id="energyCostDisplay">50 💵</span>
                </button>
                <button class="shop-btn energy-max" onclick="buyMaxEnergy()">
                    <span class="icon">📈</span>
                    <span class="text">Увеличить максимум</span>
                    <span class="price" id="maxEnergyCostDisplay">100 💵</span>
                </button>
                <div class="energy-info">
                    <span>⚡ Текущий максимум: <span id="maxEnergyDisplay">500</span></span>
                </div>
            </div>

            <!-- Вкладка бонусов -->
            <div class="tab-panel" id="tab-bonus">
                <button class="shop-btn bonus" onclick="claimDailyBonus()">
                    <span class="icon">📅</span>
                    <span class="text">Ежедневный бонус</span>
                    <span class="price" id="bonusTimer">Готово!</span>
                </button>
                <button class="shop-btn bonus" onclick="buyLuck()">
                    <span class="icon">🍀</span>
                    <span class="text">Удача (x2 на 30 сек)</span>
                    <span class="price">300 💵</span>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
