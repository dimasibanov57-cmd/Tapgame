<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💰 ТАПАЛКА МЕГА</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- ЗВЁЗДНЫЙ ФОН -->
        <div id="stars"></div>
        
        <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
        <div class="header">
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">💵 Баланс</span>
                    <span class="stat-value" id="coinCounter">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">⚡ Энергия</span>
                    <div class="energy-bar">
                        <div class="energy-fill" id="energyFill"></div>
                    </div>
                    <span class="stat-value small" id="energyCounter">500/500</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">📊 Уровень</span>
                    <span class="stat-value" id="levelDisplay">1</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">🏅 Престиж</span>
                    <span class="stat-value" id="prestigeDisplay" style="color:#ff6bff;">0</span>
                </div>
            </div>
        </div>

        <!-- КУПЮРА 100$ -->
        <div class="coin-wrapper">
            <div class="coin-glow"></div>
            <div class="combo-display" id="comboDisplay">🔥 x1</div>
            <img id="coinImage" src="https://emojicdn.elk.sh/💵" alt="100 долларов">
            <div id="floatingTexts"></div>
        </div>

        <!-- ИНФО -->
        <div class="income-info">
            <span>💹 Доход/сек: <span id="incomeDisplay">0</span></span>
            <span>💪 Сила тапа: <span id="tapPowerDisplay">1</span></span>
            <span>🔥 Комбо: <span id="comboCount">0</span></span>
        </div>

        <!-- ВКЛАДКИ -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="upgrades">⬆️ Улучшения</button>
            <button class="tab-btn" data-tab="business">🏢 Бизнес</button>
            <button class="tab-btn" data-tab="energy">⚡ Энергия</button>
            <button class="tab-btn" data-tab="bonus">🎁 Бонусы</button>
            <button class="tab-btn" data-tab="stats">📊 Статистика</button>
        </div>

        <!-- СОДЕРЖИМОЕ -->
        <div class="shop-content">
            <!-- ВКЛАДКА УЛУЧШЕНИЙ -->
            <div class="tab-panel active" id="tab-upgrades">
                <button class="shop-btn upgrade" onclick="buyUpgrade(50, 1)"><span class="icon">⬆️</span><span class="text">Улучшить тап</span><span class="price">50 💵</span></button>
                <button class="shop-btn mega" onclick="buyUpgrade(200, 5)"><span class="icon">🚀</span><span class="text">Мега-тап</span><span class="price">200 💵</span></button>
                <button class="shop-btn ultra" onclick="buyUpgrade(1000, 20)"><span class="icon">💎</span><span class="text">Ультра-тап</span><span class="price">1000 💵</span></button>
                <button class="shop-btn legendary" onclick="buyUpgrade(5000, 100)"><span class="icon">⭐</span><span class="text">Легендарный тап</span><span class="price">5000 💵</span></button>
                <button class="shop-btn auto" onclick="buyAutoClicker()"><span class="icon">🤖</span><span class="text">Авто-кликер</span><span class="price" id="autoPrice">5000 💵</span></button>
            </div>

            <!-- ВКЛАДКА БИЗНЕСА -->
            <div class="tab-panel" id="tab-business">
                <button class="shop-btn business" onclick="buyBusiness(0)"><span class="icon">🥤</span><span class="text">Ларёк (+10/сек)</span><span class="price" id="businessCost0">500 💵</span></button>
                <button class="shop-btn business" onclick="buyBusiness(1)"><span class="icon">🏪</span><span class="text">Магазин (+50/сек)</span><span class="price" id="businessCost1">2000 💵</span></button>
                <button class="shop-btn business" onclick="buyBusiness(2)"><span class="icon">🏬</span><span class="text">Супермаркет (+300/сек)</span><span class="price" id="businessCost2">10 000 💵</span></button>
                <button class="shop-btn business" onclick="buyBusiness(3)"><span class="icon">🏭</span><span class="text">Завод (+1500/сек)</span><span class="price" id="businessCost3">50 000 💵</span></button>
                <button class="shop-btn business" onclick="buyBusiness(4)"><span class="icon">🚚</span><span class="text">Логистика (+8000/сек)</span><span class="price" id="businessCost4">200 000 💵</span></button>
                <button class="shop-btn business" onclick="buyBusiness(5)"><span class="icon">🏗️</span><span class="text">Стройка (+50 000/сек)</span><span class="price" id="businessCost5">1 000 000 💵</span></button>
                <button class="shop-btn business" onclick="buyBusiness(6)"><span class="icon">🛢️</span><span class="text">Нефть (+300 000/сек)</span><span class="price" id="businessCost6">5 000 000 💵</span></button>
                <button class="shop-btn business" onclick="buyBusiness(7)"><span class="icon">🛸</span><span class="text">Космос (+2M/сек)</span><span class="price" id="businessCost7">25 000 000 💵</span></button>
                <button class="shop-btn business" onclick="buyBusiness(8)"><span class="icon">🏦</span><span class="text">Банк (+15M/сек)</span><span class="price" id="businessCost8">100 000 000 💵</span></button>
                <button class="shop-btn business" onclick="buyBusiness(9)"><span class="icon">🌍</span><span class="text">Корпорация (+100M/сек)</span><span class="price" id="businessCost9">500 000 000 💵</span></button>
            </div>

            <!-- ВКЛАДКА ЭНЕРГИИ -->
            <div class="tab-panel" id="tab-energy">
                <button class="shop-btn energy-buy" onclick="buyEnergy()"><span class="icon">🔋</span><span class="text">Восстановить энергию</span><span class="price" id="energyCostDisplay">50 💵</span></button>
                <button class="shop-btn energy-max" onclick="buyMaxEnergy()"><span class="icon">📈</span><span class="text">Увеличить максимум</span><span class="price" id="maxEnergyCostDisplay">100 💵</span></button>
                <button class="shop-btn energy-regen" onclick="buyRegenSpeed()"><span class="icon">⚡</span><span class="text">Ускорить регенерацию</span><span class="price" id="regenCostDisplay">200 💵</span></button>
                <div class="energy-info">
                    <span>⚡ Максимум: <span id="maxEnergyDisplay">500</span></span>
                    <span>🔄 Регенерация: <span id="regenSpeedDisplay">1/сек</span></span>
                </div>
            </div>

            <!-- ВКЛАДКА БОНУСОВ -->
            <div class="tab-panel" id="tab-bonus">
                <button class="shop-btn bonus" onclick="claimDailyBonus()"><span class="icon">📅</span><span class="text">Ежедневный бонус</span><span class="price" id="bonusTimer">Готово!</span></button>
                <button class="shop-btn bonus" onclick="claimWeeklyBonus()"><span class="icon">📆</span><span class="text">Еженедельный бонус</span><span class="price" id="weeklyBonusTimer">⏳ 7 дней</span></button>
                <button class="shop-btn bonus" onclick="buyLuck()"><span class="icon">🍀</span><span class="text">Удача (x2 на 30 сек)</span><span class="price">300 💵</span></button>
                <button class="shop-btn bonus" onclick="playLottery()"><span class="icon">🎰</span><span class="text">Лотерея (x2-x10)</span><span class="price">100 💵</span></button>
                <button class="shop-btn bonus" onclick="buyOffshore()"><span class="icon">🛡️</span><span class="text">Офшор (защита от налогов)</span><span class="price" id="offshorePrice">5000 💵</span></button>
                <button class="shop-btn bonus" onclick="buyInvestment()"><span class="icon">💼</span><span class="text">Инвестиция (+5% дивидендов)</span><span class="price" id="investmentPrice">10 000 💵</span></button>
                <button class="shop-btn prestige-btn" onclick="prestige()"><span class="icon">🔄</span><span class="text">ПРЕСТИЖ (за 1 000 000 💵)</span><span class="price">⭐ +1</span></button>
            </div>

            <!-- ВКЛАДКА СТАТИСТИКИ -->
            <div class="tab-panel" id="tab-stats">
                <div class="stats-grid">
                    <div class="stat-card"><span>💰 Всего заработано</span><span id="totalEarned">0</span></div>
                    <div class="stat-card"><span>👆 Всего кликов</span><span id="totalClicksDisplay">0</span></div>
                    <div class="stat-card"><span>🏢 Бизнесов</span><span id="businessCount">0</span></div>
                    <div class="stat-card"><span>⭐ Престиж</span><span id="prestigeStat">0</span></div>
                    <div class="stat-card"><span>🏆 Достижений</span><span id="achievementCount">0/10</span></div>
                    <div class="stat-card"><span>⏱️ Время в игре</span><span id="playTime">0 мин</span></div>
                </div>
                <div class="achievements-list" id="achievementsList"></div>
            </div>
        </div>

        <!-- НАЛОГОВОЕ ПРЕДУПРЕЖДЕНИЕ -->
        <div class="tax-warning" id="taxWarning">⚠️ Налог 10% спишется через <span id="taxTimer">60</span> сек</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
